<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTableMaker - 웹에서 간편하게 만드는 게임 데이터 테이블</title>
<meta name="description" content="엑셀처럼 편집하고 JSON으로 내보내는 무료 데이터 테이블 편집기. 게임 데이터 작성에 맞춰 ID 규칙, 테이블 참조, 설명서까지 설치 없이 브라우저에서 바로.">
<!-- 검색·링크 미리보기: 같은 사이트가 github.io에도 있어서 대표 주소는 pages.dev로 -->
<link rel="canonical" href="https://gametablemaker.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GameTableMaker">
<meta property="og:title" content="GameTableMaker - 웹에서 간편하게 만드는 게임 데이터 테이블">
<meta property="og:description" content="엑셀처럼 편집하고 JSON으로 내보내는 무료 데이터 테이블 편집기. 설치 없이 브라우저에서 바로.">
<meta property="og:url" content="https://gametablemaker.pages.dev/">
<meta property="og:image" content="https://gametablemaker.pages.dev/img/og.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
<!-- 화면이 그려지기 전에 테마를 정한다 (늦게 정하면 다크→라이트로 한 번 깜빡인다). 바꾸는 곳은 js/settings/SettingsMenu.js -->
<script>try { const t = localStorage.getItem('tablemaker.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header>
  <!-- 지금 프로젝트 이름. 누르면 프로젝트 바꾸기 · 새로 만들기 (js/settings/ProjectMenu.js) -->
  <details id="projMenu" class="dropmenu projmenu"><summary title="프로젝트 바꾸기 · 새 프로젝트"></summary><div class="menu left"></div></details>
  <h1>GameTableMaker</h1>
  <details id="appMenu" class="dropmenu appmenu">
    <summary aria-label="메뉴" title="설정">☰</summary>
    <div class="menu">
      <div class="h">GitHub 계정</div>
      <!-- 로그인 · 로그아웃 (js/settings/GitHubAccount.js). 저장소 고르기는 불러오기 ▾ → GitHub, 올리기는 파일 저장 ▾ → GitHub에 커밋 -->
      <div id="ghAccount"></div>
      <hr>
      <div class="h">화면 테마</div>
      <button data-theme-pick="system"><span class="dot"></span>시스템 설정 따름</button>
      <button data-theme-pick="light"><span class="dot"></span>라이트</button>
      <button data-theme-pick="dark"><span class="dot"></span>다크</button>
      <hr>
      <!-- 같은 탭으로 연다: 새 탭에서 '← GameTableMaker로'를 누르면 툴이 두 탭에서 열려 같은 저장 공간을 서로 덮어쓸 수 있다 -->
      <a href="guide.html">사용 안내</a>
      <button id="donate">커피 한 잔 후원</button>
      <div class="h" id="appVersion"></div>
    </div>
  </details>
</header>
<div class="layout">
<!-- 광고 자리 (왼쪽만, 160×600 세로 광고). 지금은 비워 둔다 -->
<aside class="side"></aside>
<div class="work">
<div class="toolbar">
  <details id="openMenu" class="dropmenu outline">
    <summary title="가져온 파일은 목록 창에서 테이블(새 탭) · 설명(→ 테이블) · 설정으로 먼저 나눠 보여 주고, 들어갈 곳은 바꿀 수 있습니다.&#10;JSON · CSV 하나만 고르면 바로 새 탭으로 열립니다.&#10;엑셀에서 복사한 표는 빈 곳을 누르고 Ctrl+V 하면 새 탭으로 열립니다">불러오기 ▾</summary>
    <div class="menu left">
      <button data-gh title="GitHub 저장소의 폴더에서 바로 불러옵니다. 공개 저장소는 로그인 없이, 비공개 저장소는 ☰ → GitHub 로그인 후">GitHub <small>저장소 폴더에서</small></button>
      <button data-open="file">파일 <small>JSON · CSV · MD · ZIP · XLSX</small></button>
      <button data-open="folder">폴더 <small>안의 JSON · CSV · MD 전부</small></button>
    </div>
  </details>
  <input type="file" id="file" accept=".json,.csv,.md,.zip,.xlsx" multiple hidden>
  <input type="file" id="folder" webkitdirectory multiple hidden>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="toggleJson">JSON 보기</button>
  <button id="toggleMeta">테이블 설명</button>
  <details id="saveMenu" class="dropmenu primary">
    <summary>파일 저장 ▾</summary>
    <div class="menu">
      <button data-save="json">JSON… <small>탭을 골라서</small></button>
      <button data-save="md">설명서 (.md)… <small>탭을 골라서</small></button>
      <hr>
      <button data-save="project" title="모든 탭의 JSON과 설명서, 설정 메모(_TableMaker.md: 탭 순서·보기·숨긴 경고)를 zip 하나로 저장합니다. 압축을 풀어 그대로 쓰거나, 불러오기(파일·폴더)로 다시 열면 설정 그대로 열립니다">프로젝트 전체 (.zip) <small>JSON + 설명서 + 설정</small></button>
      <hr>
      <button data-gh-commit title="불러오기에서 쓰던 GitHub 저장소 폴더에, 바뀐 파일(JSON · 설명서 · 설정)만 커밋 하나로 올립니다. 로그인 토큰에 쓰기 권한(Contents: Read and write)이 필요합니다">GitHub에 커밋… <small>바뀐 파일만</small></button>
    </div>
  </details>
</div>
<!-- 탭 줄: 왼쪽은 탭만 넘어가는 칸, 오른쪽은 고정 칸(+ · ↻ · ⚙) (TabsView) -->
<div class="tabbar"><nav id="tabs"></nav><div id="tabtools"></div></div>
<main><table id="grid"></table></main>
<div id="panels" hidden>
  <section id="json" hidden>
    <div class="bar"><b>JSON 미리보기</b><span class="spacer"></span><button id="copy">복사</button><button id="closeJson">닫기</button></div>
    <pre id="out"></pre>
  </section>
  <section id="meta" hidden tabindex="-1"><!-- 창 아무 데나 눌러도 붙여넣기 대상이 되게 -->
    <div class="bar"><b id="metaTitle"></b><span class="spacer"></span><button id="closeMeta">닫기</button></div>
    <div class="metabody">
      <textarea id="tdesc" placeholder="이 테이블은 무엇인가요? (예: 무기 아이템 목록. 상점·드롭에서 사용)&#10;엑셀 Meta 시트(Column · Description · Type)를 복사해 이 창에 붙여넣으면 아래 설명이 한 번에 채워집니다"></textarea>
      <table><tbody id="cdesc"></tbody></table>
    </div>
  </section>
</div>
</div>
<!-- 메모장 (Memo.js): 넓은 화면에서 늘 떠 있고, 좁은 화면에서는 숨긴다 -->
<aside class="side"><label class="memo"><span>메모</span><textarea id="memo" spellcheck="false" placeholder="커밋 메시지나 작업 기록을 적어 두세요. 프로젝트마다 따로 저장됩니다"></textarea></label></aside>
</div>
<script type="module">
import {App} from './js/App.js';
new App();
</script>
</body>
</html>
